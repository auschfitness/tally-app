<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally · App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B5CE6;--blue-deep:#1E45B8;--green:#1FA97A;--coral:#EA5B4C;--navylogo:#0F1B33;--bg:#EEF1F7;--main:#F7F9FC;--surface:#FFFFFF;--surface-2:#EEF2FA;--sidebar:#0F1B33;--text:#12213D;--text-2:#6B7688;--border:#E5E9F2;--warn:#E8833A;}
  [data-theme="dark"]{--bg:#0A0F1C;--main:#0E1626;--surface:#141E33;--surface-2:#1C2A44;--sidebar:#0A1120;--text:#E7ECF5;--text-2:#94A2B8;--border:#26344F;--blue:#4C7BFF;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{background:var(--sidebar);color:#AEB8CC;padding:20px 14px;display:flex;flex-direction:column;gap:3px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .brand .wm{font-size:20px;color:#fff;font-weight:600}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#9AA6BE;font-weight:500;border:none;background:transparent;width:100%;text-align:left;position:relative}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff}
  .navitem.active{background:rgba(76,123,255,.18);color:#fff}
  .navitem.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--blue)}
  .navitem .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);color:#cfd8e6;padding:1px 8px;border-radius:20px}
  .navsep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
  .side .foot{margin-top:auto;font-size:11px;color:#6C7A94;padding:10px 8px;line-height:1.6}
  .side .foot button{background:none;border:none;color:#8A98B4;font-size:11px;text-decoration:underline;padding:0}
  .main{background:var(--main);display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--main);z-index:5}
  .church{display:flex;align-items:center;gap:9px}
  .church .logo{width:30px;height:30px;border-radius:8px;background:var(--navylogo);display:flex;align-items:center;justify-content:center}
  .church b{font-size:14px;color:var(--text)}.church span{font-size:11px;color:var(--text-2);display:block}
  .pillsel{display:flex;background:rgba(43,92,230,.10);border-radius:9px;padding:3px;gap:2px}
  .pillsel button{border:none;background:transparent;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--blue)}
  .pillsel button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .plan{font-size:11px;font-weight:600;background:rgba(43,92,230,.12);padding:5px 10px;border-radius:20px;color:var(--blue)}
  .spacer{flex:1}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{color:var(--text)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px}
  .btn:hover{background:var(--blue-deep)}
  .btn.ghost{background:rgba(43,92,230,.12);color:var(--blue)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.danger{background:rgba(234,91,76,.14);color:var(--coral)}
  .content{padding:24px;overflow:auto}
  h1.page{font-size:24px;font-weight:600;margin-bottom:3px;color:var(--text)}
  .sub{color:var(--text-2);font-size:13px;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .stat .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);font-weight:600;margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:600;line-height:1;color:var(--text)}
  .stat.alert{border-color:rgba(234,91,76,.4);background:rgba(234,91,76,.07)}.stat.alert .v{color:var(--coral)}
  .stat .v.pos{color:var(--green)}.stat .v.neg{color:var(--coral)}
  .row2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:20px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
  .panel .ph{display:flex;align-items:center;margin-bottom:12px;gap:10px}
  .panel h3{font-size:15px;font-weight:600;color:var(--text)}
  .li{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .li:last-child{border-bottom:none}
  .av{width:30px;height:30px;border-radius:50%;background:rgba(43,92,230,.13);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--blue);flex-shrink:0}
  .av.c{background:rgba(234,91,76,.16);color:var(--coral)}
  .li .meta{color:var(--text-2);font-size:12px}
  .li b{color:var(--text)}
  .li .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .flag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(234,91,76,.15);color:var(--coral)}
  .empty{color:var(--text-2);font-size:13px;padding:18px 0;text-align:center}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
  th{background:var(--surface-2);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text);font-weight:600}
  tr:last-child td{border-bottom:none}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .chip.member{background:rgba(31,169,122,.16);color:var(--green)}
  .chip.visitor{background:rgba(43,92,230,.15);color:var(--blue)}
  .chip.leader{background:rgba(107,79,214,.18);color:#8b74e8}
  .chip.care{background:rgba(234,91,76,.16);color:var(--coral)}
  .link{color:var(--blue);background:none;border:none;font-size:12.5px;font-weight:600}
  .muted{color:var(--text-2);font-size:12px}
  .pos{color:var(--green);font-weight:600}.neg{color:var(--coral);font-weight:600}
  .board{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  .post{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:11px}
  .post .pt{font-weight:600;font-size:13.5px;margin-bottom:3px;color:var(--text)}
  .post .pb{font-size:12.5px;color:var(--text-2)}
  .post .pm{font-size:11px;color:var(--blue);margin-top:8px;font-weight:600}
  .todo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px 14px}
  .t{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .t:last-child{border-bottom:none}
  .t span.tx{color:var(--text)}
  .cbx{width:17px;height:17px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
  .cbx.done{background:var(--green);border-color:var(--green)}
  .t.done span.tx{text-decoration:line-through;color:var(--text-2)}
  .t .who{margin-left:auto;font-size:11px;color:var(--blue);background:rgba(43,92,230,.12);padding:2px 8px;border-radius:20px}
  .t .del{color:var(--text-2);border:none;background:none;font-size:15px;line-height:1}
  .fundbar{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .fundbar:last-child{border-bottom:none}
  .fundbar .fn{font-weight:500;color:var(--text)}
  .fundbar .fv{margin-left:auto;font-weight:600}
  .sel{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--text);font-family:inherit}
  .tabs{display:flex;gap:18px;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .tab{padding:10px 2px;margin-bottom:-1px;border:none;background:none;color:var(--text-2);font-weight:600;font-size:14px;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--blue)}
  .setrow{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--border)}
  .setrow:last-child{border-bottom:none}
  .setrow .lbl{font-weight:500;color:var(--text);min-width:190px}
  .setrow .lbl small{display:block;font-weight:400;color:var(--text-2);font-size:11.5px;margin-top:2px}
  .setrow .ctrl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
  .setrow input,.setrow select{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13px}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .tagx{display:inline-flex;align-items:center;gap:7px;background:rgba(43,92,230,.12);color:var(--blue);padding:4px 6px 4px 11px;border-radius:20px;font-size:12px;font-weight:500}
  .tagx button{border:none;background:none;color:var(--blue);font-size:14px;line-height:1}
  .switch{width:44px;height:25px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0}
  .switch.on{background:var(--blue)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on::after{left:22px}
  .overlay{position:fixed;inset:0;background:rgba(6,10,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modal.wide{max-width:540px}
  .modal h3{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--text)}
  .modal .msub{font-size:12.5px;color:var(--text-2);margin-bottom:14px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
  .field input,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--surface-2)}
  .field.check{display:flex;align-items:center;gap:8px}
  .field.check input{width:auto}.field.check label{margin:0}
  .mrow{display:flex;gap:10px}.mrow .field{flex:1}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);padding:9px;border-radius:9px;font-weight:600;font-size:13px}
  .seg button.on[data-t="in"]{background:rgba(31,169,122,.16);color:var(--green);border-color:rgba(31,169,122,.4)}
  .seg button.on[data-t="out"]{background:rgba(234,91,76,.16);color:var(--coral);border-color:rgba(234,91,76,.4)}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .modal .actions .btn{flex:1;justify-content:center}
  .searchbox{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--surface-2);margin-bottom:8px}
  .chklist{max-height:46vh;overflow:auto;margin:2px -6px}
  .chkrow{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:8px}
  .chkrow:hover{background:var(--surface-2)}
  .chkrow .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .chkrow.sel .box{background:var(--green);border-color:var(--green)}
  .chkrow.sel{background:rgba(31,169,122,.08)}
  .chkrow .nm{color:var(--text)}.chkrow .mt{margin-left:auto;color:var(--text-2);font-size:12px}
  @media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.row2,.board{grid-template-columns:1fr}.setrow .ctrl{max-width:100%}}
  .compose{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start}
  .compose textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;background:var(--surface-2);color:var(--text);resize:vertical;min-height:46px}
  .feeditem{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .feeditem .fh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .feeditem .fh .nm{font-weight:600;color:var(--text)}.feeditem .fh .tm{color:var(--text-2);font-size:12px;margin-left:auto}
  .feeditem .fx{color:var(--text);font-size:14px;line-height:1.55;white-space:pre-wrap}
  .feeditem .fa{margin-top:10px;display:flex;gap:16px}
  .likebtn{border:none;background:none;color:var(--text-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .likebtn.on{color:var(--coral)}
  .pray{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .pray.answered{border-color:rgba(31,169,122,.5);background:rgba(31,169,122,.06)}
  .pray .ph2{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .pray .who{font-weight:600;color:var(--text)}
  .pray .pv{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-2);background:var(--surface-2);padding:2px 8px;border-radius:20px}
  .pray .rx{color:var(--text);font-size:14px;line-height:1.5}
  .pray .pa{margin-top:11px;display:flex;gap:12px;align-items:center}
  .answeredtag{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em}
  .cloud{display:flex;flex-wrap:wrap;gap:7px 14px;align-items:baseline}
  .cloudw{border:none;background:none;color:var(--blue);font-weight:600;font-family:inherit;line-height:1.25;padding:2px 5px;border-radius:6px}
  .cloudw:hover{background:rgba(43,92,230,.10)}
  .cloudw.on{background:var(--blue);color:#fff}
  .ptopics{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .ptag{font-size:11px;font-weight:500;color:var(--text-2);background:var(--surface-2);padding:2px 9px;border-radius:20px}
  .cloudbox{position:relative;height:330px;width:100%;overflow:hidden}
  .cw{position:absolute;top:0;left:0;border:none;background:none;font-family:inherit;font-weight:600;line-height:1;padding:1px 3px;border-radius:6px;white-space:nowrap;cursor:pointer}
  .cw[data-vert="1"]{transform:rotate(-90deg)}
  .cw:hover{opacity:.65}
  .cw.on{text-decoration:underline;text-underline-offset:3px}
  .cw-topic{color:var(--green)}
  .cw-name{color:var(--blue)}
  .cw-group{color:#8b74e8}
  .cloudleg{display:flex;gap:14px;font-size:11.5px;color:var(--text-2);align-items:center}
  .cloudleg span{display:flex;align-items:center;gap:5px}
  .cloudleg i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .lg-name{background:var(--blue)}.lg-topic{background:var(--green)}.lg-group{background:#8b74e8}
  .prbar{display:flex;align-items:center;margin-bottom:10px}
  .prbar .link{margin-left:auto}
  .hb{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .hb.healthy{background:rgba(31,169,122,.16);color:var(--green)}
  .hb.attention{background:rgba(232,131,58,.18);color:#E8833A}
  .hb.risk{background:rgba(234,91,76,.16);color:var(--coral)}
  .gtop{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start}
  .gcard{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .gcard:hover{border-color:var(--blue);transform:translateY(-1px)}
  .gc-top{display:flex;align-items:center;margin-bottom:4px}.gc-name{font-weight:600;color:var(--text)}.gc-top .hb{margin-left:auto}
  .gc-sub{font-size:12px;color:var(--text-2);margin-bottom:11px}
  .gbar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .gbar>i{display:block;height:100%;border-radius:6px}
  .gbar>i.healthy{background:var(--green)}.gbar>i.attention{background:#E8833A}.gbar>i.risk{background:var(--coral)}
  .gc-foot{font-size:11px;color:var(--text-2)}
  .donutwrap{position:relative;height:180px}
  .donutctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  .donutctr b{font-size:26px;font-weight:600;color:var(--text);display:block;line-height:1}
  .donutctr span{font-size:11px;color:var(--text-2)}
  .leg{display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:12.5px;color:var(--text-2)}
  .leg span{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .stat,.panel{box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05)}
  [data-theme="dark"] .stat,[data-theme="dark"] .panel,[data-theme="dark"] .gcard{box-shadow:none}
  h1.page{font-size:22px}
  .chartbox{position:relative;height:210px}
  .fundrow{margin-bottom:13px}
  .fundlbl{display:flex;font-size:13px;margin-bottom:5px;color:var(--text)}
  .fundlbl span{margin-left:auto;font-weight:600}
  .ministrip{display:flex;gap:22px;margin-bottom:16px;flex-wrap:wrap}
  .ministrip .mi-k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);font-weight:600}
  .ministrip .mi-v{font-size:20px;font-weight:600}
  .engrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
  .engrow:hover,.engrow.on{background:var(--surface-2)}
  .englbl{width:78px;font-size:13px;color:var(--text)}
  .engbar{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .engbar>i{display:block;height:100%;border-radius:6px}
  .engbar>i.healthy{background:var(--green)}.engbar>i.attention{background:#E8833A}.engbar>i.risk{background:var(--coral)}
  .engn{width:30px;text-align:right;font-weight:600;color:var(--text);font-size:13px}
  .drawer-ov{position:fixed;inset:0;background:rgba(6,10,20,.4);z-index:60}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);background:var(--surface);box-shadow:-12px 0 40px rgba(0,0,0,.18);z-index:61;padding:22px;overflow:auto}
  .dh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .dh .av{width:48px;height:48px;font-size:16px}
  .dh .nm{font-size:18px;font-weight:600;color:var(--text)}.dh .rl{font-size:12px;color:var(--text-2)}
  .kv{display:flex;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border)}
  .kv span{color:var(--text-2)}.kv b{margin-left:auto;color:var(--text);font-weight:500}
  .tlm{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin:14px 0 4px}
  .tlrow{position:relative;padding:8px 0 8px 16px;border-left:2px solid var(--border)}
  .tlrow::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
  .tlrow.attendance::before{background:var(--green)}.tlrow.care::before{background:var(--coral)}.tlrow.milestone::before{background:#8b74e8}
  .tlrow .tt{font-size:13.5px;color:var(--text);font-weight:500}.tlrow .ts{font-size:12px;color:var(--text-2)}.tlrow .td{font-size:11px;color:var(--text-2)}
  .jsnap{display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap}

function prayerCloudData(){
  var all=(state.prayers||[]).filter(function(p){return !p.answered;});var m={};
  function add(text,cat){var k=cat+"|"+text;if(!m[k])m[k]={text:text,cat:cat,count:0};m[k].count++;}
  all.forEach(function(p){(p.topics||[]).forEach(function(tp){add(tp,"topic");});if(p.group)add(p.group,"group");if(p.author&&p.author!=="Anônimo")add(p.author,"name");});
  var arr=Object.keys(m).map(function(k){return m[k];});
  arr.sort(function(a,b){return b.count-a.count;});
  return arr.slice(0,28);
}
function prayerMatch(p,f){if(!f)return true;if(f.cat==="topic")return (p.topics||[]).indexOf(f.val)>=0;if(f.cat==="group")return p.group===f.val;if(f.cat==="name")return p.author===f.val;return true;}

function ansLeft(p){if(!p.answeredDate)return"";var d=Math.ceil(30-(today()-new Date(p.answeredDate))/(1000*60*60*24));return d>0?("some em "+d+" dia"+(d>1?"s":"")):"some em breve";}

function layoutPrayerCloud(){
  var box=document.getElementById("cloudbox");if(!box)return;
  var W=box.clientWidth,H=box.clientHeight,cx=W/2,cy=H/2;
  var words=[].slice.call(box.querySelectorAll(".cw"));var placed=[];
  words.forEach(function(el){
    var vert=el.dataset.vert==="1";var w=el.offsetWidth,h=el.offsetHeight;
    var bw=vert?h:w,bh=vert?w:h,pad=7,done=false;
    for(var r=0;r<900&&!done;r++){
      var ang=r*0.55,rad=r*1.15;
      var px=cx+rad*Math.cos(ang)-bw/2,py=cy+rad*Math.sin(ang)*0.6-bh/2;
      if(px<2||py<2||px+bw>W-2||py+bh>H-2)continue;
      var b2={x:px-pad,y:py-pad,w:bw+2*pad,h:bh+2*pad};
      var hit=placed.some(function(b){return !(b2.x+b2.w<b.x||b2.x>b.x+b.w||b2.y+b2.h<b.y||b2.y>b.y+b.h);});
      if(!hit){placed.push(b2);if(vert){el.style.left=(px+bw/2-w/2)+"px";el.style.top=(py+bh/2-h/2)+"px";}else{el.style.left=px+"px";el.style.top=py+"px";}el.style.visibility="visible";done=true;}
    }
    if(!done){el.style.visibility="hidden";}
  });
}

  var base=Math.max(8,Math.round(members*0.82));var factors=[1.0,1.03,0.99,1.05,1.02,0.86,0.9,0.98];var labels=[],data=[];
  for(var i=7;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i*7);labels.push(d.getDate()+"/"+(d.getMonth()+1));}

function financeMonthly(){

  var months=[],labels=[];var now=today();var mn=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function journeyIndex(s){for(var i=0;i<JOURNEY.length;i++){if(JOURNEY[i][0]===s)return i;}return 0;}
function journeyLabel(s){for(var i=0;i<JOURNEY.length;i++){if(JOURNEY[i][0]===s)return JOURNEY[i][1];}return "—";}
var MSTYPE={first_visit:"Primeira visita",second_visit:"Segunda visita",conversion:"Conversão",baptism:"Batismo",joined_group:"Entrou em um grupo",started_serving:"Começou a servir",completed_track:"Concluiu trilha",membership:"Tornou-se membro",leadership:"Tornou-se líder",returned:"Retornou após ausência",prayer_answered:"Oração respondida"};
function stickBy(id){return (state.people||[]).find(function(p){return p.id===id;});}
function householdOf(p){if(!p.household)return null;return (state.households||[]).find(function(h){return h.name===p.household;});}
function stickTimeline(p){
  var ev=[];
  (p.milestones||[]).forEach(function(m){ev.push({date:m.date,type:"milestone",title:MSTYPE[m.type]||m.type,sub:""});});
  (state.sessions||[]).forEach(function(s){if((s.attendees||[]).indexOf(p.id)>=0)ev.push({date:s.date,type:"attendance",title:"Presente no culto",sub:s.campus});});
  (state.prayers||[]).forEach(function(pr){if(pr.author===p.name){var open=pr.privacy==="church";ev.push({date:pr.date,type:"prayer",title:open?"Pedido de oração":"Contexto pastoral atualizado",sub:open?pr.request:"Visibilidade restrita"});if(pr.answered&&pr.answeredDate)ev.push({date:pr.answeredDate,type:"milestone",title:"Oração respondida",sub:""});}});
  var cr=careReasons(p);if(cr.length)ev.push({date:iso(today()),type:"care",title:"Tally notou uma mudança",sub:cr.map(function(r){return r.full;}).join(" · ")});
  ev.sort(function(a,b){return b.date.localeCompare(a.date);});return ev;
}
function timelineHtml(ev){if(!ev.length)return '<div class="empty">Nenhuma história registrada ainda.</div>';var out="",curM="";ev.forEach(function(e){var d=new Date(e.date);var mk=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][d.getMonth()]+" "+d.getFullYear();if(mk!==curM){out+='<div class="tlm">'+mk+'</div>';curM=mk;}out+='<div class="tlrow '+e.type+'"><div class="td">'+d.getDate()+'</div><div class="tt">'+esc(e.title)+'</div>'+(e.sub?'<div class="ts">'+esc(e.sub)+'</div>':'')+'</div>';});return out;}
function signals(){
  var out=[];
  state.people.filter(inCampus).forEach(function(p){
    var w=weeksSince(p.lastSeen);
    if(w>=3){out.push({key:"att-"+p.id,type:"attendance",level:"attention",stickId:p.id,stickName:p.name,title:p.name+" pode precisar de atenção",why:["Sem aparecer há "+w+" semanas"].concat(!p.group?["Não está em um grupo"]:[]).concat(p.followup?["Follow-up em aberto"]:[]),date:iso(today()),category:"Care"});}
    else if(!p.group&&(p.relationship==="visitor_first"||p.relationship==="visitor_returning")){out.push({key:"grp-"+p.id,type:"journey",level:"notice",stickId:p.id,stickName:p.name,title:p.name+" ainda não entrou em um grupo",why:["Visitante sem grupo"],date:iso(today()),category:"Journey"});}
    else if(p.followup){out.push({key:"fu-"+p.id,type:"care",level:"attention",stickId:p.id,stickName:p.name,title:p.name+" tem follow-up em aberto",why:["Follow-up pendente"],date:iso(today()),category:"Care"});}
    (p.milestones||[]).forEach(function(m){var dd=Math.round((today()-new Date(m.date))/(1000*60*60*24));if(dd>=0&&dd<=21)out.push({key:"ms-"+p.id+"-"+m.type,type:"milestone",level:"celebration",stickId:p.id,stickName:p.name,title:p.name+" · "+(MSTYPE[m.type]||m.type),why:[],date:m.date,category:"Celebration"});});
  });
  (typeof groupsHealth==="function"?groupsHealth():[]).forEach(function(g){if(g.band==="risk")out.push({key:"gh-"+g.name,type:"group_health",level:"attention",groupName:g.name,title:"Grupo "+g.name+" com saúde baixa",why:[g.rate+"% dos membros em dia"],date:iso(today()),category:"Groups"});});
  state.tasks.filter(function(t){return !t.done&&t.who;}).forEach(function(t){out.push({key:"task-"+t.id,type:"team",level:"notice",title:esc(t.who)+" foi designado: "+esc(t.text),why:[],date:iso(today()),category:"Teams",stickName:t.who});});
  return out;
}
function sigStatus(k){var o=(state.signalOverrides||{})[k];return o?o.status:"new";}
function setSig(k,st){if(!state.signalOverrides)state.signalOverrides={};state.signalOverrides[k]=Object.assign({},state.signalOverrides[k]||{},{status:st});save();}
function activeSignals(){return signals().filter(function(s){return sigStatus(s.key)!=="dismissed";});}
function signalsFor(id){return activeSignals().filter(function(s){return s.stickId===id;});}
function journeySnap(p){var idx=journeyIndex(p.journeyStage);return '<div class="jsnap">'+JOURNEY.map(function(j,i){var cls=i<idx?"done":(i===idx?"cur":"");return '<div class="jstep '+cls+'"><div class="jdot"></div><span>'+j[1]+'</span></div>';}).join("")+'</div>';}
function attStrip(p){var w=Math.min(12,weeksSince(p.lastSeen));var out="";for(var i=11;i>=0;i--){out+='<div class="wk '+((i<w)?"absent":"present")+'"></div>';}return '<div class="wkstrip">'+out+'</div>';}
function ageOf(p){if(!p.birthDate)return null;return Math.floor((today()-new Date(p.birthDate))/(1000*60*60*24*365.25));}
function buildPeopleDonut(){var el=document.getElementById("compDonut");if(!el)return;var ppl=state.people.filter(inCampus);
  var c={visitor:0,attendee:0,member:0,inactive:0};ppl.forEach(function(p){var r=p.relationship;if(r==="visitor_first"||r==="visitor_returning")c.visitor++;else if(r==="attendee")c.attendee++;else if(r==="inactive")c.inactive++;else c.member++;});
  CHARTS.pc=new Chart(el,{type:"doughnut",data:{labels:["Visitantes","Frequentadores","Membros","Inativos"],datasets:[{data:[c.visitor,c.attendee,c.member,c.inactive],backgroundColor:["#2B5CE6","#3E9AB0","#1FA97A","#8A96AE"],borderWidth:0,hoverOffset:6}]},options:{cutout:"66%",maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},onClick:function(ev,els){if(els&&els.length){var v=["visitor","attendee","member","inactive"][els[0].index];state.stickRel=(state.stickRel===v)?null:v;save();render();}}}});
}
function stickMatch(p){var q=(state.stickSearch||"").toLowerCase();var rf=state.stickRel;var cf=state.stickCare;
  var mq=!q||p.name.toLowerCase().indexOf(q)>=0;
  var mr=!rf||(rf==="visitor"?p.relationship.indexOf("visitor")===0:(rf==="leader"?isLeader(p):p.relationship===rf));
  var n=careReasons(p).length;var lvl=n===0?"em":(n===1?"at":"ri");var mc=!cf||cf===lvl;
  return mq&&mr&&mc;
}

  var d=riskDist();var maxc=Math.max(d.em,d.at,d.ri,1);

  var chips=[["","Todos"],["visitor","Visitantes"],["member","Membros"],["leader","Líderes"],["inactive","Inativos"]].map(function(c){var on=(state.stickRel||"")===c[0]||(!state.stickRel&&c[0]==="");return '<button class="fchip'+(on?" on":"")+'" data-srel="'+c[0]+'">'+c[1]+'</button>';}).join("");
  var list=ppl.filter(stickMatch);
  var rows=list.map(function(p){var sg=signalsFor(p.id).length;var age=ageOf(p);return '<tr data-stick="'+p.id+'"><td><b>'+esc(p.name)+'</b>'+(age!=null?' <span class="muted">· '+age+'a</span>':'')+'</td><td>'+relChip(p)+'</td><td>'+journeyLabel(p.journeyStage)+'</td><td>'+(p.group?esc(p.group):'<span class="muted">sem grupo</span>')+'</td><td>'+esc(agoLabel(p.lastSeen))+'</td><td>'+(sg?('<span class="chip care">'+sg+' sinal'+(sg>1?'is':'')+'</span>'):'<span class="muted">—</span>')+'</td></tr>';}).join("")||'<tr><td colspan="6" class="empty">Nenhuma Stick nesse filtro.</td></tr>';
  return '<div style="display:flex;align-items:flex-start;margin-bottom:6px"><div><h1 class="page">Sticks</h1><p class="sub" style="margin:0">Pessoas da sua igreja. Cada pessoa é uma Stick, uma vida que não passa despercebida.</p></div><button class="btn" id="addBtnTop" style="margin-left:auto">+ Nova pessoa</button></div>'
   +'<div class="ministrip" style="margin-top:14px"><div><div class="mi-k">Sticks</div><div class="mi-v">'+ppl.length+'</div></div><div><div class="mi-k">Visitantes</div><div class="mi-v">'+ppl.filter(function(p){return p.relationship.indexOf("visitor")===0;}).length+'</div></div><div><div class="mi-k">Precisam de atenção</div><div class="mi-v neg">'+unaccounted().length+'</div></div></div>'
   +'<div class="row2"><div class="panel"><div class="ph"><h3>Composição</h3></div><div class="donutwrap"><canvas id="compDonut"></canvas><div class="donutctr"><b>'+ppl.length+'</b><span>Sticks</span></div></div><div class="leg"><span data-srel="visitor" style="cursor:pointer"><i style="background:#2B5CE6"></i>Visitantes</span><span data-srel="member" style="cursor:pointer"><i style="background:#1FA97A"></i>Membros</span><span style="cursor:default"><i style="background:#8A96AE"></i>Inativos</span></div></div>'
   +'<div class="panel"><div class="ph"><h3>Engajamento</h3><span class="muted" style="margin-left:auto">toque numa faixa</span></div>'+eng+'</div></div>'
   +'<div class="panel" style="margin-bottom:16px"><div class="ph"><h3>Todas as Sticks</h3><input class="searchbox" style="max-width:220px;margin:0 0 0 auto" id="stickSearch" placeholder="Buscar por nome..." value="'+esc(state.stickSearch||"")+'"></div><div class="filtchips">'+chips+'</div><table style="border:none"><tr><th>Stick</th><th>Relação</th><th>Jornada</th><th>Grupo</th><th>Última presença</th><th>Sinais</th></tr>'+rows+'</table></div>';
}
function viewStickProfile(id){
  var p=stickBy(id);if(!p)return '<button class="link" id="stickBack">&#8592; Sticks</button><div class="empty">Stick não encontrada.</div>';
  var tab=state.stickTab||"overview";
  var age=ageOf(p);var hh=householdOf(p);
  var head='<button class="link" id="stickBack">&#8592; Voltar para Sticks</button><div class="dh" style="margin:12px 0 6px"><div class="av">'+initials(p.name)+'</div><div><div class="nm">'+esc(p.name)+'</div><div class="rl">'+relLabelFull(p)+(isLeader(p)?" · Líder":"")+' · '+esc(p.campus)+' · Jornada: '+journeyLabel(p.journeyStage)+'</div></div><button class="btn ghost" id="addMs" data-stick="'+p.id+'" style="margin-left:auto">+ Milestone</button></div>';
  var tabs='<div class="tabs2"><button class="tab2 '+(tab==="overview"?"on":"")+'" data-stab="overview">Overview</button><button class="tab2 '+(tab==="timeline"?"on":"")+'" data-stab="timeline">Timeline</button><button class="tab2 '+(tab==="attendance"?"on":"")+'" data-stab="attendance">Presença</button></div>';
  var body="";
  if(tab==="overview"){
    var ev=stickTimeline(p).slice(0,6);
    var grp=p.group?('<div class="kv"><span>Grupo</span><b>'+esc(p.group)+'</b></div>'):'';
    var hhh=hh?('<div class="kv"><span>Household</span><b>'+esc(hh.name)+'</b></div>'+hh.members.map(function(m){return '<div class="kv"><span></span><b style="font-weight:400">'+esc(m)+'</b></div>';}).join("")):'<div class="empty">Sem household conectado.</div>';
    var lastMs=(p.milestones||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
    body='<div class="row2"><div class="panel"><div class="ph"><h3>Jornada</h3><span class="muted" style="margin-left:auto">'+journeyLabel(p.journeyStage)+'</span></div>'+journeySnap(p)+'<div class="ph" style="margin-top:18px"><h3>Timeline recente</h3></div>'+timelineHtml(ev)+'</div>'
     +'<div class="panel"><div class="ph"><h3>Contexto</h3></div><div class="kv"><span>Última presença</span><b>'+esc(agoLabel(p.lastSeen))+'</b></div><div class="kv"><span>Primeira visita</span><b>'+(p.firstVisit?p.firstVisit.split("-").reverse().join("/"):"—")+'</b></div>'+grp+'<div class="kv"><span>Origem</span><b>'+esc(p.source||"—")+'</b></div><div class="kv"><span>Milestone recente</span><b>'+(lastMs?esc(MSTYPE[lastMs.type]||lastMs.type):"—")+'</b></div><div class="ph" style="margin-top:16px"><h3>Household</h3></div>'+hhh+'</div></div>';
  } else if(tab==="timeline"){
    body='<div class="panel">'+timelineHtml(stickTimeline(p))+'</div>';
  } else {
    var ctx='<div class="kv"><span>Cultos de domingo</span><b>'+(72-Math.min(40,weeksSince(p.lastSeen)*6))+'%</b></div>'+(p.group?'<div class="kv"><span>'+esc(p.group)+'</span><b>'+(61)+'%</b></div>':'');
    var obs=careReasons(p).length?('Atenção: '+careReasons(p)[0].full):'Presença consistente.';
    body='<div class="row2"><div class="panel"><div class="ph"><h3>Frequência (12 semanas)</h3></div>'+attStrip(p)+'<div class="muted" style="margin-top:12px">'+esc(obs)+'</div></div><div class="panel"><div class="ph"><h3>Por contexto</h3></div>'+ctx+'</div></div>';
  }
  return head+tabs+body;
}

  openModal('<h3>Atribuir Care</h3><div class="msub">'+esc(s.title)+'</div><div class="field"><label>Responsável</label><select id="ca-who"><option>'+esc(state.account.name||"Você")+'</option>'+leaders.map(function(p){return '<option>'+esc(p.name)+'</option>';}).join("")+'</select></div><div class="mrow"><div class="field"><label>Próxima ação</label><input id="ca-action" placeholder="Ex.: Ligar para a pessoa"></div><div class="field"><label>Prazo</label><input type="date" id="ca-due" value="'+iso(today())+'"></div></div><div class="field"><label>Prioridade</label><select id="ca-pri"><option>Notice</option><option selected>Attention</option><option>Urgent</option></select></div><div class="actions"><button class="btn ghost" id="ca-cancel">Cancelar</button><button class="btn" id="ca-save">Criar Care</button></div>');
  document.getElementById("ca-cancel").onclick=closeModal;
  document.getElementById("ca-save").onclick=function(){if(!state.careItems)state.careItems=[];state.careItems.push({id:uid(),stickId:s.stickId,stickName:s.stickName,signalKey:s.key,title:s.title,reason:(s.why||[]).join(" · "),assignedTo:document.getElementById("ca-who").value,nextAction:document.getElementById("ca-action").value.trim(),due:document.getElementById("ca-due").value,priority:document.getElementById("ca-pri").value,status:"assigned",createdAt:iso(today()),contacts:[]});setSig(s.key,"assigned");save();closeModal();render();};
}
function contactModal(id){
  openModal('<h3>Registrar contato</h3><div class="field"><label>O que aconteceu</label><input id="cc-note" placeholder="Ex.: Liguei para a pessoa, conversamos..."></div><div class="mrow"><div class="field"><label>Data</label><input type="date" id="cc-date" value="'+iso(today())+'"></div></div><div class="field check"><input type="checkbox" id="cc-resolve"><label>Marcar como resolvido</label></div><div class="actions"><button class="btn ghost" id="cc-cancel">Cancelar</button><button class="btn" id="cc-save">Salvar</button></div>');
  document.getElementById("cc-cancel").onclick=closeModal;
  document.getElementById("cc-save").onclick=function(){var it=(state.careItems||[]).find(function(x){return x.id===id;});if(!it)return;it.contacts=it.contacts||[];var n=document.getElementById("cc-note").value.trim();if(n)it.contacts.push({date:document.getElementById("cc-date").value,note:n,by:state.account.name});it.status=document.getElementById("cc-resolve").checked?"resolved":"in_progress";save();closeModal();render();};
}
function viewCare(){
  var items=(state.careItems||[]).filter(function(it){var st=stickBy(it.stickId);return (!st)||st.campus===state.activeCampus;}).filter(function(it){return it.status!=="resolved"&&it.status!=="closed";});
  var resolved=(state.careItems||[]).filter(function(it){return it.status==="resolved"||it.status==="closed";}).length;
  var open=activeSignals().filter(function(s){return s.category==="Care"&&sigStatus(s.key)!=="assigned";});
  var itemCards=items.map(function(it){var contacts=(it.contacts||[]).slice().reverse().map(function(c){return '<div style="font-size:12.5px;color:var(--text-2);padding:3px 0"><b style="color:var(--text)">'+c.date.split("-").reverse().join("/")+'</b> · '+esc(c.note)+'</div>';}).join("");
    return '<div class="panel" style="margin-bottom:12px"><div style="display:flex;align-items:flex-start;gap:12px"><div class="av c">'+(it.stickName?initials(it.stickName):"!")+'</div><div style="flex:1"><div style="font-weight:600;color:var(--text)">'+esc(it.stickName||it.title)+'</div><div class="muted" style="margin:5px 0">'+esc(it.reason)+'</div><div style="font-size:12.5px;color:var(--text-2)">Responsável: <b style="color:var(--text)">'+esc(it.assignedTo)+'</b> · Próxima ação: '+esc(it.nextAction||"—")+' · Prazo: '+(it.due?it.due.split("-").reverse().join("/"):"—")+'</div>'+(contacts?'<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px">'+contacts+'</div>':"")+'</div><div style="display:flex;flex-direction:column;gap:6px">'+(it.stickId?'<button class="btn ghost sm" data-stick="'+it.stickId+'">Ver Stick</button>':"")+'<button class="btn ghost sm" data-contact="'+it.id+'">Registrar contato</button></div></div></div>';}).join("")||'<div class="empty">Nenhum care em aberto. Atribua um a partir de um sinal abaixo.</div>';
  var sigCards=open.map(function(s){return '<div class="panel" style="margin-bottom:12px"><div style="display:flex;align-items:flex-start;gap:12px"><div class="av c">'+(s.stickName?initials(s.stickName):"!")+'</div><div style="flex:1"><div style="font-weight:600;color:var(--text)">'+esc(s.title)+'</div><div class="muted" style="margin:6px 0 3px">Por que o Tally notou</div>'+s.why.map(function(w){return '<div style="font-size:13px;color:var(--text-2)">• '+esc(w)+'</div>';}).join("")+'</div><div style="display:flex;flex-direction:column;gap:6px">'+(s.stickId?'<button class="btn ghost sm" data-stick="'+s.stickId+'">Ver Stick</button>':"")+'<button class="btn sm" data-assign="'+s.key+'">Atribuir Care</button><button class="btn ghost sm" data-dismiss="'+s.key+'">Dispensar</button></div></div></div>';}).join("")||'<div class="empty">Nenhum sinal de cuidado aguardando.</div>';
  return '<h1 class="page">Care</h1><p class="sub">Cuidado pastoral. Quem precisa de atenção, e o que estamos fazendo.</p><div class="ministrip"><div><div class="mi-k">Care em aberto</div><div class="mi-v">'+items.length+'</div></div><div><div class="mi-k">Sinais aguardando</div><div class="mi-v neg">'+open.length+'</div></div><div><div class="mi-k">Resolvidos</div><div class="mi-v pos">'+resolved+'</div></div></div><h3 style="font-size:15px;font-weight:600;margin:6px 0 12px;color:var(--text)">Care em aberto</h3>'+itemCards+'<h3 style="font-size:15px;font-weight:600;margin:22px 0 12px;color:var(--text)">Sinais aguardando ação</h3>'+sigCards;
}
function viewInbox(){
  var cats=[["all","Todos"],["Care","Care"],["Journey","Pessoas"],["Groups","Grupos"],["Celebration","Celebrações"]];
  var cf=state.inboxCat||"all";var rank={attention:0,notice:1,celebration:2};
  var sigs=activeSignals().filter(function(s){return sigStatus(s.key)!=="snoozed"&&sigStatus(s.key)!=="assigned";}).filter(function(s){return cf==="all"||s.category===cf;}).slice().sort(function(a,b){return (rank[a.level]||0)-(rank[b.level]||0);});
  var tabs='<div class="filtchips">'+cats.map(function(c){return '<button class="fchip'+(cf===c[0]?" on":"")+'" data-inboxcat="'+c[0]+'">'+c[1]+'</button>';}).join("")+'</div>';
  var rows=sigs.map(function(s){var col=s.level==="celebration"?"#8b74e8":(s.level==="attention"?"var(--coral)":"var(--blue)");var bg=s.level==="celebration"?"rgba(139,116,232,.16)":(s.level==="attention"?"rgba(234,91,76,.16)":"rgba(43,92,230,.13)");return '<div class="li"><div class="av" style="background:'+bg+';color:'+col+'">'+(s.stickName?initials(s.stickName):(s.groupName?"G":"!"))+'</div><div style="flex:1"><div><b>'+esc(s.title)+'</b></div><div class="meta">'+esc(s.category)+(s.why.length?" · "+esc(s.why[0]):"")+'</div></div><div class="right">'+(s.stickId?'<button class="btn ghost sm" data-stick="'+s.stickId+'">Abrir</button>':"")+(s.category==="Care"?'<button class="link" data-assign="'+s.key+'">Atribuir</button>':"")+'<button class="link" data-snooze="'+s.key+'">Adiar</button><button class="link" data-dismiss="'+s.key+'">Dispensar</button></div></div>';}).join("")||'<div class="empty">Nada para notar nessa categoria.</div>';
  return '<h1 class="page">Inbox</h1><p class="sub">Coisas que a sua igreja deveria notar.</p>'+tabs+'<div class="panel">'+rows+'</div>';
}
document.addEventListener("click",function(e){var t=e.target.closest?e.target.closest("[data-assign],[data-contact],[data-snooze],[data-inboxcat]"):null;if(!t)return;
  if(t.getAttribute("data-assign")){assignCareModal(t.getAttribute("data-assign"));return;}
  if(t.getAttribute("data-contact")){contactModal(t.getAttribute("data-contact"));return;}
  if(t.getAttribute("data-snooze")){setSig(t.getAttribute("data-snooze"),"snoozed");render();return;}
  if(t.getAttribute("data-inboxcat")){state.inboxCat=t.getAttribute("data-inboxcat");save();render();return;}
});



var SB_URL="https://zzgxeylyrtzsqcdguxql.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Z3hleWx5cnR6c3FjZGd1eHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3OTcyNzgsImV4cCI6MjA5OTM3MzI3OH0.Az_WOYNsX5L3qKyply5SotBVuBYten6vkN2Q4OUrFOU";
var LOGO_SVG='<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="96" height="96" rx="26" fill="#2B5CE6"/><g stroke="#fff" stroke-width="6" stroke-linecap="round"><line x1="34" y1="34" x2="34" y2="66"/><line x1="43" y1="34" x2="43" y2="66"/><line x1="52" y1="34" x2="52" y2="66"/><line x1="61" y1="34" x2="61" y2="66"/><line x1="28" y1="68" x2="67" y2="32"/></g></svg>';
function gel(){return document.getElementById("gate");}
function hideGate(){var g=gel();if(g)g.style.display="none";}
function showGate(inner){var g=gel();if(!g)return;g.style.display="flex";g.innerHTML='<div class="gcard">'+LOGO_SVG+inner+'</div>';}
function gateError(m){var e=document.getElementById("g-err");if(e){e.textContent=String(m);}else{showGate('<div class="gerr">'+esc(String(m))+'</div><button class="gbtn" id="g-retry">Voltar</button>');var r=document.getElementById("g-retry");if(r)r.onclick=function(){showAuth("login");};}}
function emptyState(){return {view:"dashboard",settingsTab:"inst",activeCampus:"",careWeeks:3,institution:{name:"",currency:"BRL",campuses:[],funds:[],catIn:[],catOut:[],multiInstitution:false,institutions:[],activeInstitution:""},account:{name:"",role:"owner",language:"pt",timezone:"America/Sao_Paulo"},groups:[],prayers:[],prayerFilter:null,people:[],households:[],posts:[],tasks:[],entries:[],sessions:[],careItems:[],signalOverrides:{}};}
function blankState(orgName,campusName,currency){var s=emptyState();s.activeCampus=campusName;s.institution={name:orgName,currency:currency,campuses:[campusName],funds:["Geral","Missões","Construção","Social"],catIn:["Dízimo","Oferta","Doação","Campanha"],catOut:["Aluguel","Utilidades","Salários","Missões","Ação social","Eventos","Manutenção"],multiInstitution:false,institutions:[orgName],activeInstitution:orgName};s.account.name=(USER&&USER.email)?USER.email.split("@")[0]:"Você";return s;}
function save(){if(!ORG_ID||!SB)return;clearTimeout(_saveTimer);_saveTimer=setTimeout(function(){SB.from("app_state").upsert({org_id:ORG_ID,data:state,updated_at:new Date().toISOString(),updated_by:USER?USER.id:null}).then(function(r){if(r&&r.error)console.warn("save error",r.error.message);});},400);}
function startApp(){console.log("Tally build v3 (rpc create_org)");var g=gel();if(g){g.style.display="flex";g.innerHTML='<div class="gcard">'+LOGO_SVG+'<div class="gsub">Carregando…</div></div>';}
  if(!window.supabase){showGate('<div class="gerr">Não consegui carregar o Supabase. Verifique a conexão e recarregue.</div>');return;}
  SB=window.supabase.createClient(SB_URL,SB_KEY);
  SB.auth.getSession().then(function(res){if(res.data&&res.data.session){afterAuth();}else{showAuth("login");}});}
function showAuth(mode){mode=mode||"login";
  showGate('<div class="gtitle">Tally</div><div class="gsub">'+(mode==="login"?"Entre na sua conta":"Crie a sua conta")+'</div><div class="gfield"><input id="g-email" type="email" placeholder="E-mail" autocomplete="email"></div><div class="gfield"><input id="g-pw" type="password" placeholder="Senha" autocomplete="current-password"></div><div id="g-err" class="gerr"></div><button class="gbtn" id="g-primary">'+(mode==="login"?"Entrar":"Criar conta")+'</button><button class="gbtn goauth" id="g-google">Continuar com Google</button><div class="gswitch">'+(mode==="login"?'Não tem conta? <a id="g-toswitch">Cadastre-se</a>':'Já tem conta? <a id="g-toswitch">Entrar</a>')+'</div>');
  document.getElementById("g-primary").onclick=function(){var em=document.getElementById("g-email").value.trim();var pw=document.getElementById("g-pw").value;if(mode==="login")doLogin(em,pw);else doSignup(em,pw);};
  document.getElementById("g-google").onclick=doGoogle;
  document.getElementById("g-toswitch").onclick=function(){showAuth(mode==="login"?"signup":"login");};}
function doLogin(em,pw){if(!em||!pw){gateError("Preencha e-mail e senha.");return;}SB.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error){gateError(r.error.message);return;}afterAuth();});}
function doSignup(em,pw){if(!em||!pw){gateError("Preencha e-mail e senha.");return;}SB.auth.signUp({email:em,password:pw}).then(function(r){if(r.error){gateError(r.error.message);return;}if(r.data&&r.data.session){afterAuth();}else{showGate('<div class="gsub">Conta criada. Se a confirmação de e-mail estiver ligada, confirme pelo link enviado e depois entre.</div><button class="gbtn" id="g-back">Ir para o login</button>');document.getElementById("g-back").onclick=function(){showAuth("login");};}});}
function doGoogle(){SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}}).then(function(r){if(r&&r.error)gateError(r.error.message);});}
function afterAuth(){showGate('<div class="gsub">Carregando…</div>');SB.auth.getUser().then(function(u){if(u.error||!u.data.user){showAuth("login");return;}USER=u.data.user;SB.from("memberships").select("org_id").limit(1).then(function(m){if(m.error){gateError(m.error.message);return;}if(!m.data||!m.data.length){showOnboarding();return;}loadOrg(m.data[0].org_id);});});}
function showOnboarding(){
  showGate('<div class="gtitle">Sua igreja</div><div class="gsub">Vamos criar a sua igreja no Tally.</div><div class="gfield"><input id="o-name" placeholder="Nome da igreja"></div><div class="gfield"><input id="o-campus" placeholder="Primeiro campus (ex.: Sede)"></div><div class="gfield"><select id="o-cur"><option value="BRL">Real (BRL)</option><option value="USD">Dólar (USD)</option></select></div><div id="g-err" class="gerr"></div><button class="gbtn" id="o-create">Criar igreja</button><div class="gswitch"><a id="o-logout">Sair</a></div>');
  document.getElementById("o-create").onclick=function(){var n=document.getElementById("o-name").value.trim();var c=document.getElementById("o-campus").value.trim()||"Sede";var cur=document.getElementById("o-cur").value;if(!n){gateError("Dê um nome à igreja.");return;}createOrg(n,c,cur);};
  document.getElementById("o-logout").onclick=function(){SB.auth.signOut().then(function(){location.reload();});};}
function createOrg(name,campusName,currency){
  showGate('<div class="gsub">Criando sua igreja…</div>');
  var st=blankState(name,campusName,currency);
  SB.rpc("create_org",{p_name:name,p_currency:currency,p_campus:campusName,p_state:st}).then(function(r){
   if(r.error){gateError(r.error.message);return;}
   ORG_ID=r.data;state=st;render();hideGate();
  });
}
function loadOrg(orgId){ORG_ID=orgId;
  SB.from("app_state").select("data").eq("org_id",orgId).maybeSingle().then(function(r){
   if(r.error){gateError(r.error.message);return;}
   if(r.data&&r.data.data&&r.data.data.institution){state=r.data.data;render();hideGate();return;}
   SB.from("organizations").select("name,currency").eq("id",orgId).single().then(function(o){
    SB.from("campuses").select("name").eq("org_id",orgId).then(function(cs){
     var org=(o.data)||{name:"Minha igreja",currency:"BRL"};var camps=((cs.data)||[]).map(function(x){return x.name;});if(!camps.length)camps=["Sede"];
     state=blankState(org.name,camps[0],org.currency);state.institution.campuses=camps;state.institution.institutions=[org.name];
     SB.from("app_state").upsert({org_id:orgId,data:state,updated_by:USER.id}).then(function(){render();hideGate();});});});});}

applyTheme();startApp();
</script>
