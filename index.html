<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally · App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="96" height="96" rx="26" fill="#2B5CE6"/><g stroke="#fff" stroke-width="6" stroke-linecap="round"><line x1="34" y1="34" x2="34" y2="66"/><line x1="43" y1="34" x2="43" y2="66"/><line x1="52" y1="34" x2="52" y2="66"/><line x1="61" y1="34" x2="61" y2="66"/><line x1="28" y1="68" x2="67" y2="32"/></g></svg>
      <span class="wm">Tally</span>
    </div>
    <button class="navitem active" data-view="dashboard"><span>Home</span></button>
    <button class="navitem" data-view="inbox"><span>Inbox</span><span class="cnt" id="cnt-inbox">0</span></button>
    <button class="navitem" data-view="people"><span>Sticks</span><span class="cnt" id="cnt-people">0</span></button>
    <button class="navitem" data-view="care"><span>Care</span></button>
    <button class="navitem" data-view="journey"><span>Journey</span></button>
    <button class="navitem" data-view="groups"><span>Saúde dos Grupos</span></button>
    <button class="navitem" data-view="study"><span>Trilhas</span></button>
    <button class="navitem" data-view="sermons"><span>Estudo</span></button>
    <button class="navitem" data-view="coord"><span>Coordenação</span><span class="cnt" id="cnt-tasks">0</span></button>
    <button class="navitem" data-view="prayer"><span>Oração</span></button>
    <button class="navitem" data-view="finance"><span>Finance Lite</span></button>
    <div class="navsep"></div>
    <button class="navitem" data-view="settings"><span>Configurações</span></button>
    <div class="foot"><span id="footUser">Tally</span><br><button id="logout">Sair</button></div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="church">
        <div class="logo"><svg width="17" height="17" viewBox="0 0 100 100"><g stroke="#4C7BFF" stroke-width="7" stroke-linecap="round"><line x1="34" y1="32" x2="34" y2="68"/><line x1="45" y1="32" x2="45" y2="68"/><line x1="56" y1="32" x2="56" y2="68"/><line x1="67" y1="32" x2="67" y2="68"/><line x1="28" y1="70" x2="73" y2="30"/></g></svg></div>
        <div><b id="instName">Grace Church</b><span>Administrador</span></div>
      </div>
      <div class="pillsel" id="instsel" style="display:none"></div>
      <div class="pillsel" id="campus"></div>
      <span class="plan">Seed · grátis</span>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeBtn" title="Alternar tema"></button>
      
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="gate"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
